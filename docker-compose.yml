# Deploys BOTH containers (web + LiteLLM worker) as one stack.
#
# Networking: services share the `smartcloud` network below, so the web app
# reaches the worker at http://litellm:4000. We deliberately do NOT declare
# Dokploy's `dokploy-network` here — Dokploy creates that network itself and
# attaches it (plus Traefik labels) to the `web` service automatically when you
# add a Domain in its UI. Declaring it as `external` would break any run where it
# doesn't pre-exist (the "network dokploy-network ... could not be found" error).
#
# Env: on Dokploy set everything once in the Compose app's Environment tab; it's
# interpolated into the ${...} placeholders below (build args + runtime env).
name: smartcloud

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      # NEXT_PUBLIC_* are ALSO read at runtime by server code.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MODEL: ${LITELLM_MODEL:-gemini/gemini-3.5-flash-lite}
      CRON_SECRET: ${CRON_SECRET:-}
      # Email notifications via SMTP (nodemailer). Leave unset to disable email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
    # `expose` (not `ports`) — no host binding. On Dokploy, Traefik reaches this
    # container over dokploy-network at port 3000 (set via the Domain's Container
    # Port), so publishing 3000 on the host would collide with other apps
    # ("port is already allocated"). For local access, see the note at the bottom.
    expose:
      - "3000"
    depends_on:
      - litellm
    networks:
      - smartcloud
    restart: unless-stopped

  # Rotation scheduler. Key-pool rotation (scheduled intervals and risk-driven
  # triggers) is driven by periodic calls to /api/cron/rotate; without a ticker
  # only the manual "Rotate now" button does anything, and every configured
  # rotation policy silently never fires.
  #
  # This replaces the old Vercel Cron entry, which does nothing off Vercel.
  # The endpoint is idempotent — it rotates a pool only when that pool's
  # interval has genuinely elapsed or its risk crossed the threshold — so the
  # tick interval is a responsiveness knob, not a correctness one. Hourly by
  # default: risk spikes get acted on within the hour, and a daily interval
  # still means one rotation per day.
  scheduler:
    image: curlimages/curl:8.11.1
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      ROTATE_URL: ${ROTATE_URL:-http://web:3000/api/cron/rotate}
      ROTATE_INTERVAL_SECONDS: ${ROTATE_INTERVAL_SECONDS:-3600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "[scheduler] CRON_SECRET is not set — rotation is DISABLED." >&2
          echo "[scheduler] Set CRON_SECRET in the environment to enable it." >&2
          # Sleep rather than exit: a crash-looping container buries the reason.
          while true; do sleep 3600; done
        fi
        echo "[scheduler] every $${ROTATE_INTERVAL_SECONDS}s -> $$ROTATE_URL"
        while true; do
          # Truncate first: curl leaves the file untouched when it cannot
          # connect, so without this a failed tick logs the PREVIOUS tick's body
          # and reads like a response that never happened.
          : > /tmp/out
          # --max-time bounds a hung request so one bad tick can't wedge the loop.
          # `-w` always emits a code (000 when the connection failed), so `|| true`
          # only stops the non-zero exit from killing the loop under `set -e`.
          code=$$(curl -s -o /tmp/out -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $$CRON_SECRET" "$$ROTATE_URL" || true)
          echo "[scheduler] $$(date -u +%FT%TZ) http=$${code:-000} $$(head -c 400 /tmp/out)"
          sleep "$$ROTATE_INTERVAL_SECONDS"
        done
    depends_on:
      - web
    networks:
      - smartcloud
    restart: unless-stopped

  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    # Internal only — the web app reaches it in-stack at http://litellm:4000.
    expose:
      - "4000"
    networks:
      - smartcloud
    restart: unless-stopped

networks:
  smartcloud:

# --- Local run (no Dokploy/Traefik) ---------------------------------------------
# The services only `expose` ports (no host binding), so to reach them from your
# host, add published ports, e.g. under `web:` add
#     ports: ["3000:3000"]
# (and optionally the same for litellm), then `docker compose up --build`.
# On Dokploy do NOT add host ports — the domain's Container Port + Traefik handle it.
